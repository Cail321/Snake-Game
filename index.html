<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07120f" />
    <title>Snake / System 01</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">◆</span>
          <div>
            <p class="eyebrow">ARCADE SYSTEM / 01</p>
            <h1>Snake</h1>
          </div>
        </div>
        <span class="build-label">MVP 0.2</span>
      </header>

      <section class="game-card" aria-label="贪吃蛇游戏区域">
        <div class="status-bar">
          <span><i class="status-dot"></i><span id="systemStatus">SYSTEM READY</span></span>
          <span id="modeStatus">MENU MODE</span>
          <div class="score-panel" aria-live="polite">
            <span class="score-label">SCORE</span>
            <strong id="scoreValue">000</strong>
          </div>
        </div>

        <div class="board-wrap">
          <canvas id="gameCanvas" width="800" height="520" aria-label="贪吃蛇棋盘"></canvas>
          <div id="mainMenu" class="menu-overlay">
            <div class="menu-panel">
              <span class="menu-kicker">WELCOME PLAYER</span>
              <h2>进入蛇行空间</h2>
              <p>收集苹果让蛇变长并累计分数。撞墙或撞到蛇身后，本局将结束。</p>
              <button id="startButton" class="primary-button" type="button">开始游戏<span>→</span></button>
            </div>
          </div>
          <div id="gameOverPanel" class="ready-panel game-over-panel hidden" aria-live="assertive">
            <span class="menu-kicker">RUN COMPLETE</span>
            <h2>游戏结束</h2>
            <p>本局最终得分</p>
            <strong id="finalScore" class="final-score">000</strong>
            <button id="restartButton" class="primary-button" type="button">重新开始<span>→</span></button>
            <button id="gameOverMenuButton" class="secondary-button" type="button">返回主菜单</button>
          </div>
        </div>

        <footer class="footer-bar">
          <span>V0.2 CORE LOOP</span>
          <span>LIVE RUN / 150MS</span>
        </footer>
        <div class="control-strip" aria-label="操作说明">
          <span>CONTROL</span>
          <span><kbd>WASD</kbd> / <kbd>ARROWS</kbd> MOVE</span>
        </div>
      </section>
    </main>
    <script src="game-core.js"></script>
    <script src="main.js"></script>
  </body>
</html>
